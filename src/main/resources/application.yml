server:
  port: 8080
  # ── Request size limits ──────────────────────────────────────────────
  max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 50MB  # for media uploads
  cloud:
    gateway:
      # ── CORS — locked to known origins ───────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - X-Request-Id
            allowCredentials: true
            maxAge: 3600

      # ── Default filters — security headers on every response ─────────
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-XSS-Protection, 1; mode=block
        - AddResponseHeader=Referrer-Policy, strict-origin-when-cross-origin
        - AddResponseHeader=Permissions-Policy, camera=(), microphone=(), geolocation=()
        - AddResponseHeader=Cache-Control, no-store
        - RemoveResponseHeader=Server

      # ── Service discovery ────────────────────────────────────────────
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # ── Routes ───────────────────────────────────────────────────────
      routes:
        # Public auth routes — no JWT required
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/sendOtp,/api/v1/auth/signin,/api/v1/auth/createUser
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # Admin auth routes
        - id: auth-service-admin
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/createAdmin
          filters:
            - JwtAuthenticationFilter

        # Protected service routes
        - id: user-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthenticationFilter

        - id: group-service
          uri: lb://group-service
          predicates:
            - Path=/api/v1/groups/**
          filters:
            - JwtAuthenticationFilter

        - id: post-service
          uri: lb://group-service
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - JwtAuthenticationFilter

        - id: meeting-service
          uri: lb://meeting-service
          predicates:
            - Path=/api/v1/meetings/**
          filters:
            - JwtAuthenticationFilter

        # Chat API for real-time messaging (stored in Redis)
        - id: chat-service
          uri: lb://meeting-service
          predicates:
            - Path=/api/v1/chat/**
          filters:
            - JwtAuthenticationFilter

        # WebSocket endpoint — requires token as query param
        - id: meeting-service-ws
          uri: lb:ws://meeting-service
          predicates:
            - Path=/ws/**
          filters:
            - JwtAuthenticationFilter

        # LiveKit WebRTC signaling — proxied through gateway for same-domain access
        - id: livekit-ws
          uri: lb:ws://livekit-livekit-server
          predicates:
            - Path=/livekit/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - JwtAuthenticationFilter

        # Media download — public (images need to load without auth in <img> tags)
        # MUST be before media-service route so /api/v1/media/*/download is not caught by /**
        - id: media-download
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/*/download

        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**
          filters:
            - JwtAuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:3kRjUdqgxIuZCeEdiX6q7kTsgtOkC75o4D5czNbTV9A=}

# ── Actuator — only health exposed, no sensitive data ──────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
